<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BancoData</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#f2f6f9;color:#18354f;padding:2rem}.error{background:#fff;padding:1.5rem;border-radius:10px}</style>
</head>
<body>
<p id="loading">Cargando simulador…</p>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/lufer17012005-lang/simulador_bancario/ac9f8180eb9bcb4a4c83d05f80612419767f44b3/web/index.html';
  try{
    let html=await(await fetch(source)).text();
    const form=`<section class="section" id="operationsView" hidden><article class="panel"><h2>Registrar operación bancaria</h2><p class="help">Elige las cuentas y el monto. Los datos del titular y el saldo se muestran automáticamente.</p><div class="notice">Simulador educativo con datos ficticios. No ingreses información bancaria real.</div><div class="fields"><div class="field"><label for="operationType">Tipo de operación *</label><select id="operationType"><option value="deposit">Depósito</option><option value="withdraw">Retiro</option><option value="transfer">Transferencia</option></select></div><div class="field"><label for="operationAccount">Cuenta de origen *</label><select id="operationAccount" required></select></div><div class="field" id="operationAccountInfo" aria-live="polite">Selecciona una cuenta para ver titular y saldo.</div><div class="field" id="destinationField" hidden><label for="operationDestination">Cuenta destino *</label><select id="operationDestination"></select><div id="operationDestinationInfo" aria-live="polite"></div></div><div class="field"><label for="operationAmount">Monto (COP) *</label><input id="operationAmount" type="number" min="1" step="1" placeholder="Ej. 150000" required></div><div class="field"><label for="operationReference">Referencia/comprobante (opcional)</label><input id="operationReference" maxlength="50" placeholder="Número de recibo"></div></div><div class="actions"><button class="btn primary" id="runOperation" type="button">Confirmar operación</button></div></article></section>`;
    html=html.replace(/<section class="section" id="operationsView" hidden>[\s\S]*?<\/section>/,form);
    const start="$('#runOperation').addEventListener('click',async()=>{";
    const end="$('#addTurn').addEventListener";
    const a=html.indexOf(start),b=html.indexOf(end,a);
    if(a<0||b<0) throw new Error('No se encontró el controlador de operaciones esperado.');
    const handler=`function updateOperationAccountInfo(){const from=state.accounts.find(a=>a.id===$('#operationAccount').value),to=state.accounts.find(a=>a.id===$('#operationDestination').value);$('#operationAccountInfo').innerHTML=from?'<b>Titular:</b> '+esc(from.name)+' · <b>Saldo disponible:</b> '+money(from.balance)+' · <b>Cuenta:</b> '+esc(from.id):'Selecciona una cuenta para ver titular y saldo.';$('#operationDestinationInfo').innerHTML=to?'<b>Destinatario:</b> '+esc(to.name)+' · <b>Cuenta:</b> '+esc(to.id):''}$('#operationType').addEventListener('change',()=>{$('#destinationField').hidden=$('#operationType').value!=='transfer';updateOperationAccountInfo()});$('#operationAccount').addEventListener('change',updateOperationAccountInfo);$('#operationDestination').addEventListener('change',updateOperationAccountInfo);$('#runOperation').addEventListener('click',async()=>{const kind=$('#operationType').value,from=state.accounts.find(a=>a.id===$('#operationAccount').value),to=state.accounts.find(a=>a.id===$('#operationDestination').value),amount=Number($('#operationAmount').value),reference=$('#operationReference').value.trim();if(!from)return toast('Selecciona una cuenta de origen válida.');if(!Number.isSafeInteger(amount)||amount<=0)return toast('Ingresa un monto entero mayor que cero.');if(kind==='transfer'&&(!to||!state.accounts.some(a=>a.id===to.id)))return toast('Selecciona una cuenta destino válida.');if(kind==='transfer'&&from.id===to.id)return toast('La cuenta de origen y destino deben ser diferentes.');if(kind!=='deposit'&&Number(from.balance)<amount)return toast('Saldo insuficiente para realizar esta operación.');let text,recordAmount=amount;if(kind==='deposit'){from.balance=Number(from.balance)+amount;text='Depósito de '+money(amount)+' en cuenta '+from.id+' ('+from.name+')'}else if(kind==='withdraw'){from.balance=Number(from.balance)-amount;recordAmount=-amount;text='Retiro de '+money(amount)+' de cuenta '+from.id+' ('+from.name+')'}else{from.balance=Number(from.balance)-amount;to.balance=Number(to.balance)+amount;recordAmount=-amount;text='Transferencia de '+money(amount)+' de cuenta '+from.id+' ('+from.name+') a cuenta '+to.id+' ('+to.name+')'}await persist(text,recordAmount,{kind,customerName:from.name,reference,accountId:from.id,destinationId:kind==='transfer'?to.id:'',relatedAccount:kind==='transfer'?to.id:from.id});$('#operationAmount').value='';$('#operationReference').value='';updateOperationAccountInfo()});`;
    html=html.slice(0,a)+handler+html.slice(b);
    html=html.replace('</body>',`<script>setTimeout(()=>{if(typeof updateOperationAccountInfo==='function')updateOperationAccountInfo()},0)<\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(error){console.error(error);document.body.innerHTML='<div class="error"><h1>No se pudo cargar el simulador</h1><p>Comprueba tu conexión e inténtalo de nuevo.</p></div>'}
})();
</script>
</body>
</html>
